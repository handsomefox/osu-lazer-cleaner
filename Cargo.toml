[workspace]
members = [
    "crates/app-update",
    "crates/cleaner-app",
    "crates/cleaner-core",
    "crates/cleaner-realm",
]
resolver = "3"

[workspace.package]
version = "1.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/osu-lazer-cleaner"
description = "A desktop app that safely removes unwanted beatmap content from an osu!lazer library"

[workspace.dependencies]
bindgen = "=0.73.2"
clap = { version = "=4.6.7", features = ["derive"] }
crossbeam-channel = "=0.5.17"
cmake = "=0.1.58"
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_extras = { version = "=0.37.0", features = ["image"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jiff = { version = "=0.2.38", features = ["serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
walkdir = "=2.5.0"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
