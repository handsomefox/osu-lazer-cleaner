[workspace]
members = [
    "crates/cleaner-app",
    "crates/cleaner-core",
    "crates/cleaner-realm",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/osu-lazer-cleaner"
description = "A Windows desktop app that safely removes unwanted beatmap content from an osu!lazer library"

[workspace.dependencies]
bindgen = "=0.73.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossbeam-channel = "=0.5.17"
cmake = "=0.1.58"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
jiff = { version = "=0.2.35", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
walkdir = "=2.5.0"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
