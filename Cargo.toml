[workspace]
members = ["crates/cleaner-realm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/osu-lazer-cleaner"
description = "A Windows desktop app that safely removes unwanted beatmap content from an osu!lazer library"

[workspace.dependencies]
bindgen = "=0.73.1"
cmake = "=0.1.58"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
walkdir = "=2.5.0"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
