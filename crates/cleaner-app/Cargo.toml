[package]
name = "cleaner-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop interface for osu-lazer-cleaner"

[lints]
workspace = true

[[bin]]
name = "osu-lazer-cleaner"
path = "src/main.rs"

[dependencies]
app-diagnostics.workspace = true
app-folders.workspace = true
app-update.workspace = true
app-update-ui.workspace = true
cleaner-core = { version = "=1.7.6", path = "../cleaner-core" }
crossbeam-channel.workspace = true
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true
serde_json.workspace = true
tracing.workspace = true

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
tempfile.workspace = true

# Referenced by build.rs; cargo-machete does not inspect build-script source.
[package.metadata.cargo-machete]
ignored = ["embed-resource"]
