[package]
name = "cleaner-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop and command-line interfaces for osu-lazer-cleaner"

[lints]
workspace = true

[[bin]]
name = "osu-lazer-cleaner"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cleaner-core = { path = "../cleaner-core" }
crossbeam-channel.workspace = true
jiff.workspace = true
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
cleaner-realm = { path = "../cleaner-realm", features = ["test-support"] }
tempfile.workspace = true

# Referenced by build.rs; cargo-machete does not inspect build-script source.
[package.metadata.cargo-machete]
ignored = ["embed-resource"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
