name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish; leave empty for a dry run
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.1
  CARGO_XWIN_VERSION: 0.23.0
  WINDOWS_CARGO_EXECUTABLE: osu-lazer-cleaner.exe
  WINDOWS_EXECUTABLE: "osu!lazer Cleaner.exe"
  WINDOWS_ARCHIVE: osu-lazer-cleaner-windows-x86_64.zip
  LINUX_EXECUTABLE: osu-lazer-cleaner
  LINUX_ARCHIVE: osu-lazer-cleaner-linux-x86_64.tar.gz

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Trace runner tools
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          rustup --version
          rustc +stable --version
          cargo +stable --version
          git --version
          gh --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Trace pinned Rust tools
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        run: scripts/install-ci-tool.sh cargo-audit
      - name: Audit committed lockfile
        run: cargo audit --file Cargo.lock

  windows:
    name: Windows build and package
    needs: audit
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Trace runner tools
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          rustup --version
          rustc +stable --version
          cargo +stable --version
          git --version
          gh --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Trace pinned Rust tools
        run: |
          rustc --version
          cargo --version
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          APP_PACKAGE: cleaner-app
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq $env:APP_PACKAGE })
          if ($packages.Count -ne 1) { throw "Expected exactly one $env:APP_PACKAGE package" }
          if ($env:TAG_NAME -ne "v$($packages[0].version)") {
            throw "Tag $env:TAG_NAME does not match application version v$($packages[0].version)"
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Lint complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native release
        run: cargo build --workspace --release --locked
      - name: Package and verify Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist | Out-Null
          $exe = $env:WINDOWS_EXECUTABLE
          $zip = $env:WINDOWS_ARCHIVE
          $artifact = Join-Path $PWD "target/release/$env:WINDOWS_CARGO_EXECUTABLE"
          Copy-Item -LiteralPath $artifact -Destination (Join-Path $dist $exe)
          Compress-Archive -CompressionLevel Optimal -LiteralPath (Join-Path $dist $exe) -DestinationPath (Join-Path $dist $zip)
          $expectedFiles = @($exe, $zip) | Sort-Object
          $actualFiles = @(Get-ChildItem $dist -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object $expectedFiles $actualFiles).Count -ne 0) { throw 'Windows asset set is incorrect' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $dist $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries.Count -ne 1 -or $entries[0] -cne $exe) { throw "ZIP must contain exactly $exe" }
          } finally {
            $archive.Dispose()
          }
      - name: Upload Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osu-lazer-cleaner-windows-assets
          path: |
            dist/${{ env.WINDOWS_EXECUTABLE }}
            dist/${{ env.WINDOWS_ARCHIVE }}
          if-no-files-found: error

  linux:
    name: Linux build and package
    needs: audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release binary needs the glibc it was linked against. Building in 22.04 holds the
    # floor at 2.35; a newer image raises it.
    container: ubuntu:22.04
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball with no submodule.
      # archive.ubuntu.com throttles GitHub's runners to a crawl; the Azure mirror is the one
      # the runner images themselves use.
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80-ci
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential cmake clang libclang-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Trace build tools
        run: |
          # sed reads to the end; head would close the pipe early and pipefail reports SIGPIPE.
          ldd --version | sed -n 1p
          gcc --version | sed -n 1p
          cmake --version | sed -n 1p
          rustc --version
          cargo --version
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Build native release
        run: cargo build --workspace --release --locked
      - name: Check glibc floor and linked libraries
        run: scripts/check-linux-floor.sh target/release/osu-lazer-cleaner
      - name: Package and verify Linux assets
        run: |
          rm -rf dist
          mkdir dist
          install -m 755 target/release/osu-lazer-cleaner "dist/$LINUX_EXECUTABLE"
          tar -czf "dist/$LINUX_ARCHIVE" --owner=0 --group=0 --numeric-owner -C dist "$LINUX_EXECUTABLE"
          rm "dist/$LINUX_EXECUTABLE"
          mapfile -t actual_assets < <(find dist -maxdepth 1 -type f -printf '%f\n')
          [[ ${#actual_assets[@]} -eq 1 && "${actual_assets[0]}" == "$LINUX_ARCHIVE" ]]
          mapfile -t entries < <(tar -tvzf "dist/$LINUX_ARCHIVE")
          [[ ${#entries[@]} -eq 1 ]]
          read -r mode _ _ _ _ name <<< "${entries[0]}"
          [[ "$mode" == -rwxr-xr-x && "$name" == "$LINUX_EXECUTABLE" ]]
      - name: Upload Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osu-lazer-cleaner-linux-assets
          path: dist/${{ env.LINUX_ARCHIVE }}
          if-no-files-found: error

  assemble:
    name: Checksum and verify
    needs: [windows, linux]
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osu-lazer-cleaner-windows-assets
          path: dist
      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osu-lazer-cleaner-linux-assets
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- "$WINDOWS_EXECUTABLE" "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" > SHA256SUMS
      - name: Verify release assets
        run: |
          mapfile -t expected_assets < <(printf '%s\n' SHA256SUMS "$WINDOWS_EXECUTABLE" "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" | sort)
          mapfile -t actual_assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual_assets[*]}" == "${expected_assets[*]}" ]]
          mapfile -t expected_hash_assets < <(printf '%s\n' "$WINDOWS_EXECUTABLE" "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" | sort)
          mapfile -t actual_hash_assets < <(cut -c67- dist/SHA256SUMS | sort)
          [[ "${actual_hash_assets[*]}" == "${expected_hash_assets[*]}" ]]
          awk 'length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 } END { if (NR != 3) exit 1 }' dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          unzip -tq "dist/$WINDOWS_ARCHIVE"
          mapfile -t zip_entries < <(unzip -Z1 "dist/$WINDOWS_ARCHIVE")
          [[ ${#zip_entries[@]} -eq 1 && "${zip_entries[0]}" == "$WINDOWS_EXECUTABLE" ]]
          mapfile -t tar_entries < <(tar -tvzf "dist/$LINUX_ARCHIVE")
          [[ ${#tar_entries[@]} -eq 1 ]]
          read -r mode _ _ _ _ name <<< "${tar_entries[0]}"
          [[ "$mode" == -rwxr-xr-x && "$name" == "$LINUX_EXECUTABLE" ]]
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osu-lazer-cleaner-release-assets
          path: |
            dist/${{ env.WINDOWS_EXECUTABLE }}
            dist/${{ env.WINDOWS_ARCHIVE }}
            dist/${{ env.LINUX_ARCHIVE }}
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Attest and publish
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: assemble
    permissions:
      attestations: write # Publish provenance for each release asset.
      contents: write # Create the GitHub release and upload assets.
      id-token: write # Request the OIDC identity used for provenance.
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osu-lazer-cleaner-release-assets
          path: dist
      - name: Independently verify release assets
        run: |
          mapfile -t expected_assets < <(printf '%s\n' SHA256SUMS "$WINDOWS_EXECUTABLE" "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" | sort)
          mapfile -t actual_assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual_assets[*]}" == "${expected_assets[*]}" ]]
          mapfile -t expected_hash_assets < <(printf '%s\n' "$WINDOWS_EXECUTABLE" "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" | sort)
          mapfile -t actual_hash_assets < <(cut -c67- dist/SHA256SUMS | sort)
          [[ "${actual_hash_assets[*]}" == "${expected_hash_assets[*]}" ]]
          awk 'length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 } END { if (NR != 3) exit 1 }' dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          unzip -tq "dist/$WINDOWS_ARCHIVE"
          mapfile -t zip_entries < <(unzip -Z1 "dist/$WINDOWS_ARCHIVE")
          [[ ${#zip_entries[@]} -eq 1 && "${zip_entries[0]}" == "$WINDOWS_EXECUTABLE" ]]
          mapfile -t tar_entries < <(tar -tvzf "dist/$LINUX_ARCHIVE")
          [[ ${#tar_entries[@]} -eq 1 ]]
          read -r mode _ _ _ _ name <<< "${tar_entries[0]}"
          [[ "$mode" == -rwxr-xr-x && "$name" == "$LINUX_EXECUTABLE" ]]
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$TAG_NAME"
          "dist/$WINDOWS_EXECUTABLE"
          "dist/$WINDOWS_ARCHIVE"
          "dist/$LINUX_ARCHIVE"
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "$TAG_NAME"
