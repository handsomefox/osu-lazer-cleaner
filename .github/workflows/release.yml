name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish; leave empty for a dry run
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_PACKAGE: cleaner-app
  BIN: osu-lazer-cleaner

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Resolve version
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Install the pinned Rust toolchain
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          rustup toolchain install
          rustc --version
          cargo --version
      # Every later job builds the commit resolved here, so a tag moved mid-run cannot mix
      # sources. A dry run has no tag and publishes nothing.
      - name: Resolve and check the version
        id: version
        env:
          TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er --arg package "$APP_PACKAGE" '[.packages[] | select(.name == $package)] |
              if length == 1 then .[0].version else error("expected one \($package) package") end')
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" != "v$version" ]]; then
              echo "error: tag $TAG does not match $APP_PACKAGE version v$version" >&2
              exit 1
            fi
            scripts/changelog-notes.sh "$version" > /dev/null
          fi
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: meta
    permissions:
      contents: read
    # zizmor suggests the "$/" form, but actionlint rejects it and GitHub documents "./", which
    # already resolves at this run's commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.meta.outputs.ref }}

  build-windows:
    name: Build Windows x86_64
    needs: meta
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ needs.meta.outputs.ref }}
      - name: Install the pinned Rust toolchain
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          rustup toolchain install
          rustc --version
          cargo --version
      - name: Build the release executable
        run: cargo build --release --locked -p "$APP_PACKAGE"
      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-windows-x86_64
          path: target/release/${{ env.BIN }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    needs: meta
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release binary needs the glibc it was linked against. Building in 22.04 holds the
    # floor at 2.35; a newer image raises it. Pinned by digest. AGENTS.md says how to refresh it.
    container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball with no submodule.
      # archive.ubuntu.com throttles GitHub's runners to a crawl; the Azure mirror is the one
      # the runner images themselves use.
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80-ci
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential cmake clang libclang-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ needs.meta.outputs.ref }}
      # rustup-init is checked against its published hash rather than piped from sh.rustup.rs.
      - name: Install the pinned Rust toolchain
        env:
          RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/rustup-init" "$RUSTUP_INIT_URL"
          echo "$RUSTUP_INIT_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: Trace build tools
        run: |
          # sed reads to the end; head would close the pipe early and pipefail reports SIGPIPE.
          ldd --version | sed -n 1p
          gcc --version | sed -n 1p
          cmake --version | sed -n 1p
          rustc --version
          cargo --version
      - name: Build the release executable
        run: cargo build --release --locked -p "$APP_PACKAGE"
      - name: Check glibc floor and linked libraries
        run: scripts/check-linux-floor.sh "target/release/$BIN"
      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-x86_64
          path: target/release/${{ env.BIN }}
          if-no-files-found: error

  assemble:
    name: Package and verify
    needs: [meta, build-windows, build-linux]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The README and LICENSE packed into each archive come from the commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
      - name: Download the Windows executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-windows-x86_64
          path: bin/windows-x86_64
      - name: Download the Linux executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-linux-x86_64
          path: bin/linux-x86_64
      - name: Package release archives
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: >-
          scripts/package-release.sh "$BIN" "$VERSION"
          "windows-x86_64=bin/windows-x86_64/$BIN.exe"
          "linux-x86_64=bin/linux-x86_64/$BIN"
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Attest and publish
    if: needs.meta.outputs.tag != ''
    needs: [meta, checks, assemble]
    permissions:
      attestations: write # Publish provenance for each release asset.
      contents: write # Create the GitHub release and upload assets.
      id-token: write # Request the OIDC identity used for provenance.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      REF: ${{ needs.meta.outputs.ref }}
    steps:
      # Cone mode keeps the top-level files, which include CHANGELOG.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
          sparse-checkout: scripts
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify release assets independently
        run: scripts/verify-release.sh dist "$BIN" "$VERSION" windows-x86_64 linux-x86_64
      - name: Write release notes
        run: scripts/changelog-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Check the tag still names the built commit
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [[ "$tagged" != "$REF" ]]; then
            echo "error: $TAG names $tagged, but this run built $REF" >&2
            exit 1
          fi
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
