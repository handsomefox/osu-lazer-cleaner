name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.1
  CARGO_XWIN_VERSION: 0.23.0

defaults:
  run:
    shell: bash

jobs:
  portable:
    name: Portable
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Trace runner tools
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          rustup --version
          rustc +stable --version
          cargo +stable --version
          git --version
          gh --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Trace pinned Rust tools
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Lint complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-machete
        run: scripts/install-ci-tool.sh cargo-machete
      - name: Detect unused dependencies
        run: cargo machete

  windows:
    name: Windows
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Trace runner tools
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          rustup --version
          rustc +stable --version
          cargo +stable --version
          git --version
          gh --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Trace pinned Rust tools
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Lint complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native release
        run: cargo build --workspace --release --locked
      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osu-lazer-cleaner-windows-x86_64
          path: target/release/osu-lazer-cleaner.exe
          if-no-files-found: error

  linux:
    name: Linux
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release binary needs the glibc it was linked against. Building in 22.04 holds the
    # floor at 2.35; a newer image raises it.
    container: ubuntu:22.04
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball with no submodule.
      # archive.ubuntu.com throttles GitHub's runners to a crawl; the Azure mirror is the one
      # the runner images themselves use.
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80-ci
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential cmake clang libclang-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Trace build tools
        run: |
          # sed reads to the end; head would close the pipe early and pipefail reports SIGPIPE.
          ldd --version | sed -n 1p
          gcc --version | sed -n 1p
          cmake --version | sed -n 1p
          rustc --version
          cargo --version
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Build native release
        run: cargo build --workspace --release --locked
      - name: Check glibc floor and linked libraries
        run: scripts/check-linux-floor.sh target/release/osu-lazer-cleaner
      - name: Upload Linux executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osu-lazer-cleaner-linux-x86_64
          path: target/release/osu-lazer-cleaner
          if-no-files-found: error

  audit:
    name: Audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trace runner tools
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          rustup --version
          rustc +stable --version
          cargo +stable --version
          git --version
          gh --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Trace pinned Rust tools
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        run: scripts/install-ci-tool.sh cargo-audit
      - name: Audit committed lockfile
        run: cargo audit --file Cargo.lock
