name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new RustSec advisory fails the audit without waiting for a push.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing is cached between runs, so incremental artifacts would be written and never read.
  CARGO_INCREMENTAL: 0
  # Keeps file and line numbers in panic backtraces without the full debug info, which is
  # slow to write and link on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Workflows
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: scripts/install-ci-tool.sh actionlint zizmor
      - name: Lint workflows
        run: actionlint
      - name: Lint scripts
        run: shellcheck scripts/*.sh
      # The pedantic persona is the one that reports unpinned container images.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic --format github .github/workflows .github/dependabot.yml

  portable:
    name: Portable
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install the pinned Rust toolchain
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          rustup toolchain install
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Lint complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-machete
        run: scripts/install-ci-tool.sh cargo-machete
      - name: Detect unused dependencies
        run: cargo machete

  windows:
    name: Windows
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install the pinned Rust toolchain
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          rustup toolchain install
          rustc --version
          cargo --version
      # Test and Clippy share one job so Clippy reuses the dependencies the tests compiled.
      - name: Test complete workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Lint complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux-floor:
    name: Linux glibc floor
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release binary needs the glibc it was linked against. Building in 22.04 holds the
    # floor at 2.35; a newer image raises it. The tests run in Portable, so this job only
    # builds and checks what the binary links, as an early warning before a release.
    # Pinned by digest. AGENTS.md says how to refresh it.
    container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball with no submodule.
      # archive.ubuntu.com throttles GitHub's runners to a crawl; the Azure mirror is the one
      # the runner images themselves use.
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80-ci
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential cmake clang libclang-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # rustup-init is checked against its published hash rather than piped from sh.rustup.rs.
      - name: Install the pinned Rust toolchain
        env:
          RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/rustup-init" "$RUSTUP_INIT_URL"
          echo "$RUSTUP_INIT_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: Trace build tools
        run: |
          # sed reads to the end; head would close the pipe early and pipefail reports SIGPIPE.
          ldd --version | sed -n 1p
          gcc --version | sed -n 1p
          cmake --version | sed -n 1p
          rustc --version
          cargo --version
      - name: Build the application
        run: cargo build --locked -p cleaner-app
      - name: Check glibc floor and linked libraries
        run: scripts/check-linux-floor.sh target/debug/osu-lazer-cleaner

  audit:
    name: Audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: scripts/install-ci-tool.sh cargo-audit
      - name: Audit committed lockfile
        run: cargo-audit audit --file Cargo.lock
